name: Проверки Telegram-бота
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg util-linux
      - run: python -m compileall -q bot.py voicebot scripts tests
      - run: python -m pytest -q
