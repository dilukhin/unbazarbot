telegram:
  bot_username: your_bot_username

  # Заполните своим Telegram user_id только в локальном config.yaml.
  admin_user_ids: []

access:
  default_group_policy: deny
  allow_private_transcription_for_admins: true
  allow_private_transcription_for_non_admins: false
  request_ttl_hours: 72
  one_time_approval_jobs: 1
  notify_admins_on_new_request: true

limits:
  max_audio_seconds: 600
  max_file_mb: 20
  admin_notify_cooldown_seconds: 300

stt:
  provider: routerai
  default_model: whisper_turbo
  language: ru

  models:
    whisper_turbo:
      provider_model: openai/whisper-large-v3-turbo
      description: дешёвый основной вариант

    whisper_large:
      provider_model: openai/whisper-large-v3
      description: более качественный Whisper-кандидат

    qwen_flash:
      provider_model: qwen/qwen3-asr-flash-2026-02-10
      description: кандидат для русского и шумного аудио


# Лимиты применяются к новым платным вызовам; кеш их не расходует.
# Суточный период начинается в 00:00 UTC. Ошибки не возвращают резерв минут.
budget:
  requests_per_minute_chat: 4
  requests_per_minute_user: 2
  daily_minutes_total: 120
  daily_minutes_chat: 60
  daily_minutes_user: 30
  max_inflight: 2

# Дополнительный платный вызов: включается явно в рабочей конфигурации.
formatter:
  enabled: false
  default_model: punctuation
  max_input_chars: 12000
  max_output_tokens: 4096
  timeout_seconds: 30
  models:
    punctuation:
      provider_model: openai/gpt-4o


# Только проверенный опубликованный канал agent-toolchain; URL фиксирован кодом.
# Кеш: TARIFF_CACHE_PATH либо routerai-prices.json рядом с внешней DB_PATH.
money:
  # Денежный предел новых запросов за сутки UTC. 0 запрещает новую оплату.
  # Рабочее значение задаётся оператором только при управляемом выпуске.
  global_daily_rub: "0"
  # Точные строки базариков. Применяются при создании нового счёта;
  # изменение существующей месячной квоты — отдельная операция администратора.
  user_monthly_bazariki: "1000"
  group_monthly_bazariki: "10000"

tariffs:
  refresh_seconds: 21600
  max_age_seconds: 172800
  timeout_seconds: 15
